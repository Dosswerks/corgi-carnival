<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jasper Junction</title>

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Jasper Junction">
    <meta property="og:description" content="Herd sheep, cows & goats on a Welsh hillside in this corgi-powered herding game.">
    <meta property="og:image" content="assets/jasper-junction-og.png">
    <meta property="og:url" content="">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Jasper Junction">
    <meta name="twitter:description" content="Herd sheep, cows & goats on a Welsh hillside in this corgi-powered herding game.">
    <meta name="twitter:image" content="assets/jasper-junction-og.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
            touch-action: none;
        }
        #game-canvas {
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        #orientation-prompt {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #1a1a1a;
            color: #f0ece2;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 9999;
            font-size: 1.2rem;
            text-align: center;
            padding: 20px;
        }
        #orientation-prompt .rotate-icon {
            font-size: 3rem;
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <div id="orientation-prompt">
        <div class="rotate-icon">📱↔️</div>
        <p>Please rotate your device to landscape</p>
    </div>
    <script src="js/engine.js"></script>
    <script src="js/input.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/render.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/save.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/scenes.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
