<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jasper Junction</title>

    <!-- iOS Web App (hides browser chrome when launched from home screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Google Fonts - Rye (western display font matching logo style) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Jasper Junction">
    <meta property="og:description" content="Herd sheep, cows & goats on a Welsh hillside in this corgi-powered herding game.">
    <meta property="og:image" content="assets/jasper-junction-og.png">
    <meta property="og:url" content="">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Jasper Junction">
    <meta name="twitter:description" content="Herd sheep, cows & goats on a Welsh hillside in this corgi-powered herding game.">
    <meta name="twitter:image" content="assets/jasper-junction-og.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
            touch-action: none;
        }
        #game-canvas {
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        #orientation-prompt {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #1a1a1a;
            color: #f0ece2;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 9999;
            font-size: 1.2rem;
            text-align: center;
            padding: 20px;
        }
        #orientation-prompt .rotate-icon {
            font-size: 3rem;
        }

        /* ===== TITLE SCREEN HTML OVERLAY ===== */
        #title-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 50;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px 20px;
            background-image: url('assets/jasper-junction-menu-bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        #title-overlay::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            pointer-events: none;
        }
        #title-overlay.active {
            display: flex;
        }

        .title-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            max-width: 400px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .title-logo {
            display: block;
            max-width: 280px;
            width: 80%;
            height: auto;
            animation: logo-breathe 4s ease-in-out infinite;
        }

        @keyframes logo-breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .title-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 280px;
        }

        .title-btn {
            display: block;
            width: 100%;
            padding: 14px 24px;
            background: rgba(50, 48, 45, 0.92);
            border: 2px solid #6a6560;
            border-radius: 10px;
            color: #e0dbd4;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Rye', Georgia, serif;
            text-transform: uppercase;
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            min-height: 48px;
        }

        .title-btn:hover,
        .title-btn:active {
            background: rgba(70, 68, 65, 0.95);
            border-color: #908a82;
            transform: scale(1.03);
        }

        #title-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 20px;
            text-align: center;
            z-index: 1;
        }

        #title-footer p {
            margin: 0 0 4px;
            color: #888;
            font-size: 13px;
            font-family: sans-serif;
        }

        #title-footer a {
            color: #f5a623;
            text-decoration: none;
        }

        .tip-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 8px;
        }

        .tip-btn {
            padding: 0;
            background: none;
            border: none;
            cursor: pointer;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: transform 0.2s;
        }

        .tip-btn:hover {
            transform: scale(1.08);
        }

        #qr-code {
            background: #fff;
            padding: 4px;
            border-radius: 4px;
        }

        /* Mobile-first responsive adjustments */
        @media (max-width: 480px) {
            .title-logo {
                max-width: 200px;
            }
            .title-buttons {
                max-width: 240px;
            }
            .title-btn {
                padding: 12px 20px;
                font-size: 0.9rem;
            }
        }

        /* On mobile landscape, shrink the title footer to avoid covering game buttons */
        @media (max-height: 500px) and (orientation: landscape) {
            #title-footer {
                padding: 6px 12px;
            }
            #title-footer p {
                font-size: 11px;
                margin-bottom: 2px;
            }
            #title-footer .tip-btn svg {
                width: 36px;
                height: 45px;
            }
            #qr-code {
                display: none;
            }
            .title-logo {
                max-width: 160px;
            }
            .title-container {
                gap: 10px;
            }
            .title-btn {
                padding: 10px 18px;
                font-size: 0.95rem;
            }
        }
        /* On very short screens, hide footer entirely to prevent overlap */
        @media (max-height: 380px) {
            #title-footer {
                display: none;
            }
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <div id="orientation-prompt">
        <div class="rotate-icon">📱↔️</div>
        <p>Please rotate your device to landscape</p>
    </div>

    <!-- Title screen HTML overlay (responsive, mobile-first) -->
    <div id="title-overlay">
        <div id="pwa-hint" style="display:none; position:absolute; top:0; left:0; right:0; background:rgba(212,160,48,0.9); color:#1a1a1a; font-size:13px; font-family:sans-serif; padding:8px 16px; text-align:center; z-index:2;">
            For fullscreen: tap <strong>Share</strong> → <strong>Add to Home Screen</strong>
            <button onclick="this.parentElement.style.display='none'; localStorage.setItem('jj-pwa-dismissed','1');" style="margin-left:12px; background:none; border:1px solid #1a1a1a; border-radius:4px; padding:2px 8px; font-size:12px; cursor:pointer;">✕</button>
        </div>
        <div class="title-container">
            <img src="assets/jasper-junction-logo.png" alt="Jasper Junction" class="title-logo" width="280" height="280">
            <div class="title-buttons">
                <button class="title-btn" id="btn-tutorial">Tutorial</button>
                <button class="title-btn" id="btn-newgame">New Game</button>
                <a href="../index.html" class="title-btn" style="text-decoration:none;">Corgi Carnival</a>
            </div>
        </div>
        <div id="title-footer">
            <p>&copy; 2026 <a href="https://andrewdoss.com" target="_blank" rel="noopener noreferrer">Andrew Doss</a></p>
            <p style="color:#aaa; font-size:13px;">Enjoying the game? Tips help keep the games coming!</p>
            <div class="tip-row">
                <form action="https://www.paypal.com/donate" method="post" target="_blank">
                    <input type="hidden" name="hosted_button_id" value="HDD77QKGC6XXN">
                    <button type="submit" class="tip-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="60" height="75" viewBox="0 0 80 100" fill="none">
                            <rect x="16" y="8" width="48" height="8" rx="2" fill="#aaa"/>
                            <rect x="34" y="2" width="12" height="8" rx="2" fill="#999"/>
                            <rect x="36" y="4" width="8" height="3" rx="1" fill="#777"/>
                            <path d="M18 16 L16 82 Q16 90 24 90 L56 90 Q64 90 64 82 L62 16 Z" fill="rgba(180,220,255,0.18)" stroke="rgba(200,230,255,0.5)" stroke-width="2"/>
                            <path d="M22 20 L21 75" stroke="rgba(255,255,255,0.15)" stroke-width="3" stroke-linecap="round"/>
                            <text x="40" y="38" text-anchor="middle" font-size="9" font-weight="bold" fill="rgba(255,255,255,0.7)" font-family="sans-serif" letter-spacing="1">TIP JAR</text>
                            <g transform="rotate(-12 40 55)"><rect x="26" y="48" width="30" height="16" rx="2" fill="#3a7d44"/><text x="41" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#6ec77a" font-family="serif">$</text></g>
                            <g transform="rotate(8 40 60)"><rect x="24" y="54" width="30" height="16" rx="2" fill="#2e6b38"/><text x="39" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#5cb868" font-family="serif">$</text></g>
                            <g transform="rotate(-5 40 65)"><rect x="28" y="62" width="30" height="16" rx="2" fill="#357a3f"/><text x="43" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#7dd48a" font-family="serif">$</text></g>
                            <ellipse cx="30" cy="78" rx="6" ry="3" fill="#d4a017" stroke="#b8860b" stroke-width="1"/>
                            <ellipse cx="42" cy="80" rx="5" ry="2.5" fill="#daa520" stroke="#b8860b" stroke-width="1"/>
                            <ellipse cx="52" cy="77" rx="5" ry="3" fill="#c9960c" stroke="#a07608" stroke-width="1"/>
                        </svg>
                    </button>
                </form>
                <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
                    <div id="qr-code"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/input.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/render.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/save.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/scenes.js"></script>
    <script src="js/main.js"></script>
    <script>
    // Show "Add to Home Screen" hint on iOS mobile (not in standalone mode)
    (function() {
        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
        var dismissed = localStorage.getItem('jj-pwa-dismissed');
        if (isIOS && !isStandalone && !dismissed) {
            var hint = document.getElementById('pwa-hint');
            if (hint) hint.style.display = 'block';
        }
    })();
    </script>
</body>
</html>
